---
# PLAY 1: Proxmox API Actions (Runs on your MacBook)
- name: Provision and Start LXC Container
  hosts: localhost
  connection: local
  vars_files:
    - secrets.yml
  
  tasks:
    - name: Ensure LXC is Created
      community.proxmox.proxmox: 
        api_host: 10.0.0.144
        api_user: "root@pam"
        api_token_id: "ansible"
        api_token_secret: "{{ vault_proxmox_token_secret }}"
        validate_certs: false 
        node: saikanth
        vmid: 150
        hostname: new-container
        ostemplate: 'local:vztmpl/debian-12-standard_12.12-1_amd64.tar.zst'
        storage: local-lvm
        password: "{{ vault_root_password }}"
        netif: '{"net0":"name=eth0,bridge=vmbr0,ip=10.0.0.156/24,gw=10.0.0.1,firewall=1"}'
        unprivileged: yes
        state: present
        pubkey: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Configure Firewall Rules
      community.proxmox.proxmox_firewall:
        api_host: 10.0.0.144
        api_user: "root@pam"
        api_token_id: "ansible"
        api_token_secret: "{{ vault_proxmox_token_secret }}"
        validate_certs: false
        vmid: 150
        node: saikanth
        rules:
          - pos: 0
            action: ACCEPT
            dport: 22
            proto: tcp
            enable: 1
            type: in
        state: present

    - name: Power On the Container
      community.proxmox.proxmox:
        api_host: 10.0.0.144
        api_user: "root@pam"
        api_token_id: "ansible"
        api_token_secret: "{{ vault_proxmox_token_secret }}"
        validate_certs: false
        vmid: 150
        node: saikanth
        state: started

    - name: Add new container to temporary inventory
      ansible.builtin.add_host:
        name: "10.0.0.156"
        groups: newly_created_containers
        ansible_ssh_pass: "{{ vault_root_password }}"
        ansible_ssh_extra_args: "-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"

# PLAY 2: Internal System Configuration (Runs via SSH)
- name: Setup User and Sudo
  hosts: newly_created_containers
  remote_user: root
  gather_facts: false
  vars_files:
    - secrets.yml

  tasks:
    - name: Wait for SSH to become available
      ansible.builtin.wait_for_connection:
        delay: 10
        timeout: 120

    - name: Update apt cache and install sudo
      ansible.builtin.apt:
        update_cache: yes
        name: sudo
        state: present

    - name: Create 'sai' admin user
      ansible.builtin.user:
        name: sai
        groups: sudo
        shell: /bin/bash
        password: "{{ 'Sai@12345' | password_hash('sha512') }}"
        state: present

    - name: Add your Mac's Public Key to the 'sai' user
      ansible.posix.authorized_key:
        user: sai
        state: present
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Allow 'sai' to use Sudo without a password (using sudoers.d)
      ansible.builtin.copy:
        dest: /etc/sudoers.d/sai
        content: 'sai ALL=(ALL) NOPASSWD:ALL'
        mode: '0440'
        validate: 'visudo -cf %s'