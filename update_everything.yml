---
- name: Fleet-Wide Security Updates
  hosts: all
  become: true
  gather_facts: true  # This lets Ansible "detect" if a machine is Ubuntu vs CentOS

  tasks:
    - name: Ensure the system is updated (Debian/Ubuntu/LXC)
      ansible.builtin.apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        purge: yes
      when: ansible_os_family == "Debian"

    - name: Ensure the system is updated (RHEL/CentOS/Fedora)
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"

    - name: Notify if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    - name: Print reboot warning
      ansible.builtin.debug:
        msg: "⚠️ Machine {{ inventory_hostname }} needs a reboot to apply updates!"
      when: reboot_required_file.stat.exists